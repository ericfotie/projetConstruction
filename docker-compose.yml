services:
  postgres:
    container_name: tiger-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Constrution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Constrution"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: tiger-backend
    build: ./Backend
    expose:
      - "8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Constrution
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    volumes:
      - uploads_data:/app/uploads
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    container_name: tiger-frontend
    build: ./Frontend
    expose:
      - "4173"
    networks:
      - frontend-net
    depends_on:
      - backend

networks:
  backend-net:
    driver: bridge
    internal: true
  frontend-net:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
