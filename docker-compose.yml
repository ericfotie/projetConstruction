services:
  db:
    image: postgres:15
    container_name: postgres_db
    # Pas besoin de ports "5432:5432" sauf si tu veux te connecter
    # depuis ton PC local avec DBeaver/pgAdmin. Sinon, supprime-les.
    environment:
      POSTGRES_DB: TIGER
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: user
    networks:
      - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d TIGER"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./BatimenTIGER
    container_name: spring_backend
    ports:
      - "8090:8090"
    environment:
      # UTILISE LE NOM DU SERVICE ("db") PAS LE CONTAINER_NAME
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/TIGER
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=user
      - FRONTEND_URL=http://localhost
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://0.0.0.0:8090/actuator/health || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build: ./tiger-construction-front
    container_name: react_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: