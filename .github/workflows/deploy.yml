name: BatimenTIGER — CI Pipeline

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────
  #  JOB 1 — Backend : compile, test, build
  # ─────────────────────────────────────────────
  backend-ci:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: Constrution
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        working-directory: Backend
        run: ./mvnw compile -q --no-transfer-progress

      - name: Run tests
        working-directory: Backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/Constrution
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./mvnw test --no-transfer-progress

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: Backend/target/surefire-reports/
          retention-days: 7

      - name: Package JAR
        working-directory: Backend
        run: ./mvnw package -DskipTests -q --no-transfer-progress

      - name: Build Docker image (backend)
        run: |
          docker build \
            --tag tiger-backend:${{ github.sha }} \
            --tag tiger-backend:latest \
            ./Backend

  # ─────────────────────────────────────────────
  #  JOB 2 — Frontend : lint, build
  # ─────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      - name: Lint
        working-directory: Frontend
        run: npm run lint

      - name: Build
        working-directory: Frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/
          retention-days: 7

      - name: Build Docker image (frontend)
        run: |
          docker build \
            --tag tiger-frontend:${{ github.sha }} \
            --tag tiger-frontend:latest \
            ./Frontend

  # ─────────────────────────────────────────────
  #  JOB 3 — Rapport final
  # ─────────────────────────────────────────────
  ci-summary:
    name: CI — Summary
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: always()

    steps:
      - name: Check pipeline status
        run: |
          echo "Backend  : ${{ needs.backend-ci.result }}"
          echo "Frontend : ${{ needs.frontend-ci.result }}"

          if [[ "${{ needs.backend-ci.result }}" != "success" || \
                "${{ needs.frontend-ci.result }}" != "success" ]]; then
            echo "CI FAILED — see job logs above."
            exit 1
          fi

          echo "CI PASSED — all checks green."
