name: BatimenTIGER — CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  COMPOSE_FILE: docker-compose.yml

# ═══════════════════════════════════════════════════════════════════
#  STAGE 1 — VALIDATION
#  Vérifie que la configuration docker-compose est syntaxiquement
#  correcte avec les secrets avant tout autre travail.
# ═══════════════════════════════════════════════════════════════════
jobs:
  validate:
    name: "CI · Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Génération du fichier .env pour la validation
        run: |
          set -euo pipefail
          {
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
          } > .env
          echo "Fichier .env généré"

      - name: Validation de la configuration docker-compose
        run: docker compose -f ${{ env.COMPOSE_FILE }} config --quiet

# ═══════════════════════════════════════════════════════════════════
#  STAGE 2 — QUALITÉ  (backend + frontend en parallèle)
# ═══════════════════════════════════════════════════════════════════
  backend-quality:
    name: "Backend · Qualité"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Vérification de la compilation
        working-directory: Backend
        run: |
          set -euo pipefail
          ./mvnw compile -q --no-transfer-progress

      - name: Analyse des dépendances
        working-directory: Backend
        run: ./mvnw dependency:analyze -q --no-transfer-progress || true

  # ─────────────────────────────────────────────────────────────────

  frontend-quality:
    name: "Frontend · Qualité"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Installation des dépendances
        working-directory: Frontend
        run: npm ci

      - name: Audit de sécurité des dépendances (npm)
        working-directory: Frontend
        run: npm audit --audit-level=high || true

      - name: Lint ESLint
        working-directory: Frontend
        run: npm run lint

# ═══════════════════════════════════════════════════════════════════
#  STAGE 3 — TESTS  (backend avec base de données réelle)
# ═══════════════════════════════════════════════════════════════════
  backend-tests:
    name: "Backend · Tests & Couverture"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-quality]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Exécution des tests
        working-directory: Backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/${{ secrets.POSTGRES_DB }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.POSTGRES_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -euo pipefail
          ./mvnw test --no-transfer-progress

      - name: Publication du rapport de tests (Surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-backend
          path: Backend/target/surefire-reports/
          retention-days: 14

      - name: Publication du rapport de couverture (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-couverture-jacoco
          path: Backend/target/site/jacoco/
          retention-days: 14

# ═══════════════════════════════════════════════════════════════════
#  STAGE 4 — BUILD  (backend + frontend en parallèle)
# ═══════════════════════════════════════════════════════════════════
  backend-build:
    name: "Backend · Build & Image Docker"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Packaging du JAR
        working-directory: Backend
        run: |
          set -euo pipefail
          ./mvnw package -DskipTests -q --no-transfer-progress

      - name: Construction de l'image Docker (backend)
        run: |
          set -euo pipefail
          docker build \
            --tag tiger-backend:${{ github.sha }} \
            --tag tiger-backend:latest \
            --label "git-commit=${{ github.sha }}" \
            --label "git-actor=${{ github.actor }}" \
            --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            ./Backend

      - name: Scan de vulnérabilités — image backend (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tiger-backend:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  # ─────────────────────────────────────────────────────────────────

  frontend-build:
    name: "Frontend · Build & Image Docker"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Installation des dépendances
        working-directory: Frontend
        run: npm ci

      - name: Build de production (Vite)
        working-directory: Frontend
        run: |
          set -euo pipefail
          npm run build

      - name: Publication de l'artefact dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/
          retention-days: 14

      - name: Construction de l'image Docker (frontend)
        run: |
          set -euo pipefail
          docker build \
            --tag tiger-frontend:${{ github.sha }} \
            --tag tiger-frontend:latest \
            --label "git-commit=${{ github.sha }}" \
            --label "git-actor=${{ github.actor }}" \
            --label "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            ./Frontend

      - name: Scan de vulnérabilités — image frontend (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tiger-frontend:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

# ═══════════════════════════════════════════════════════════════════
#  STAGE 5 — RÉSUMÉ FINAL  (toujours exécuté)
# ═══════════════════════════════════════════════════════════════════
  ci-summary:
    name: "CI · Résumé"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-build, frontend-build]
    if: always()

    steps:
      - name: Rapport final du pipeline
        run: |
          set -euo pipefail
          echo "════════════════════════════════════════════════"
          echo "   BatimenTIGER — Résultat CI"
          echo "════════════════════════════════════════════════"
          echo "   Validation      : ${{ needs.validate.result }}"
          echo "   Backend qualité : ${{ needs.backend-quality.result }}"
          echo "   Frontend qualité: ${{ needs.frontend-quality.result }}"
          echo "   Backend tests   : ${{ needs.backend-tests.result }}"
          echo "   Backend build   : ${{ needs.backend-build.result }}"
          echo "   Frontend build  : ${{ needs.frontend-build.result }}"
          echo "════════════════════════════════════════════════"
          echo "   Commit  : ${{ github.sha }}"
          echo "   Auteur  : ${{ github.actor }}"
          echo "   Branche : ${{ github.ref_name }}"
          echo "   Date    : $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "════════════════════════════════════════════════"

          if [[ "${{ needs.validate.result }}"        != "success" || \
                "${{ needs.backend-quality.result }}" != "success" || \
                "${{ needs.frontend-quality.result }}" != "success" || \
                "${{ needs.backend-tests.result }}"   != "success" || \
                "${{ needs.backend-build.result }}"   != "success" || \
                "${{ needs.frontend-build.result }}"  != "success" ]]; then
            echo ""
            echo "   ❌  CI ÉCHOUÉ — Consultez les logs ci-dessus."
            exit 1
          fi

          echo ""
          echo "   ✅  CI PASSÉ — Tous les checks sont verts."
