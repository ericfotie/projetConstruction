# --- Nom et port ---
spring.application.name=BatimenTIGER
server.port=8090

# --- Base de données (Sécurisée par variables d'environnement) ---
# Utilisation de la syntaxe ${VAR:default} pour éviter d'exposer tes mots de passe sur GitHub
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/TIGER}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:user}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# IMPORTANT : En production, utilise 'validate' ou 'none' au lieu de 'update'
# Pour le développement, tu peux garder 'update', mais n'oublie pas de changer cela avant le déploiement.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# --- Optimisation : Gestion des fichiers ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB

# --- Actuator (Supervision) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# --- Logs (Désactivés en production pour gagner en performance) ---
# Utilise des niveaux INFO ou WARN pour la production
logging.level.root=INFO
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:OFF}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_LEVEL_BINDER:OFF}